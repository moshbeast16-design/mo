<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project MO</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#000;
overflow:hidden;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

canvas{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:-1;
}

#content{
text-align:center;
animation:fade 2s;
padding:20px;
}

h1{
font-size:70px;
margin-bottom:15px;
}

p{
font-size:22px;
opacity:.8;
margin-bottom:30px;
}

button{
padding:15px 35px;
font-size:20px;
border:none;
border-radius:40px;
cursor:pointer;
background:white;
color:black;
transition:.3s;
}

button:hover{
transform:scale(1.08);
}

@keyframes fade{
from{opacity:0;}
to{opacity:1;}
}
</style>

</head>

<body>

<canvas id="stars"></canvas>

<div id="content">

<h1>MO</h1>

<p>Oops... you found me.</p>

<button onclick="explore()">Start Exploring</button>

</div>

<script>

const canvas=document.getElementById("stars");
const ctx=canvas.getContext("2d");

canvas.width=innerWidth;
canvas.height=innerHeight;

let stars=[];

for(let i=0;i<200;i++){
stars.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
r:Math.random()*2
});
}

function draw(){

ctx.clearRect(0,0,canvas.width,canvas.height);

ctx.fillStyle="white";

stars.forEach(s=>{

ctx.beginPath();

ctx.arc(s.x,s.y,s.r,0,Math.PI*2);

ctx.fill();

s.y+=0.2;

if(s.y>canvas.height)s.y=0;

});

requestAnimationFrame(draw);

}

draw();

function explore(){

alert("🚀 Welcome to Project MO! Version 1.0");

}

</script>

</body>
</html>
