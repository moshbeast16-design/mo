<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project MO</title>

<style>
body{
    margin:0;
    background:#000;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
    overflow:hidden;
}

#stars{
    position:fixed;
    inset:0;
    background:black;
}

.center{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
}

h1{
    font-size:4rem;
    letter-spacing:10px;
}

p{
    opacity:.8;
}

button{
    margin-top:20px;
    padding:14px 28px;
    border:none;
    border-radius:40px;
    font-size:18px;
    cursor:pointer;
}
</style>

</head>

<body>

<canvas id="stars"></canvas>

<div class="center">
<h1>MO</h1>

<p>Oops... you found me.</p>

<button onclick="start()">Start Exploring</button>
</div>

<script>
const canvas=document.getElementById("stars");
const ctx=canvas.getContext("2d");

function resize(){
canvas.width=innerWidth;
canvas.height=innerHeight;
}
resize();
onresize=resize;

const stars=[];

for(let i=0;i<250;i++){
stars.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
r:Math.random()*2
});
}

function animate(){

ctx.clearRect(0,0,canvas.width,canvas.height);

ctx.fillStyle="white";

for(const s of stars){

ctx.beginPath();
ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
ctx.fill();

s.y+=0.3;

if(s.y>canvas.height){
s.y=0;
s.x=Math.random()*canvas.width;
}

}

requestAnimationFrame(animate);

}

animate();

function start(){
alert("Project MO v1.0 🚀");
}
</script>

</body>
</html>
