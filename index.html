<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>The Vault</title>

<style>

html,body{
margin:0;
overflow:hidden;
background:#000814;
font-family:Arial,sans-serif;
color:white;
height:100%;
}

canvas{
position:fixed;
top:0;
left:0;
}

#content{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
text-align:center;
z-index:5;
}

h1{
font-size:70px;
letter-spacing:8px;
margin:0;
color:#9feeff;
text-shadow:
0 0 15px cyan,
0 0 35px cyan,
0 0 80px cyan;
animation:glow 3s infinite;
}

@keyframes glow{

0%{text-shadow:0 0 15px cyan;}
50%{text-shadow:0 0 50px cyan;}
100%{text-shadow:0 0 15px cyan;}

}

p{

font-size:22px;
opacity:.9;

}

button{

margin-top:35px;
padding:18px 45px;
font-size:22px;
border:none;
border-radius:50px;
background:#00d9ff;
cursor:pointer;
font-weight:bold;
transition:.3s;

}

button:hover{

transform:scale(1.08);

}

#status{

margin-top:30px;
font-size:20px;
color:#8cefff;

}

#quartz{

position:absolute;
bottom:60px;
left:50%;
transform:translateX(-50%);
font-size:90px;
animation:float 3s ease-in-out infinite;
cursor:pointer;

}

@keyframes float{

0%,100%{transform:translateX(-50%) translateY(0);}
50%{transform:translateX(-50%) translateY(-15px);}

}

</style>

</head>

<body>

<canvas id="stars"></canvas>

<div id="content">

<h1>THE VAULT</h1>

<p>A hidden world where curiosity unlocks reality.</p>

<button onclick="enter()">
ENTER
</button>

<div id="status"></div>

</div>

<div id="quartz">💎</div>

<script>

const canvas=document.getElementById("stars");
const ctx=canvas.getContext("2d");

canvas.width=innerWidth;
canvas.height=innerHeight;

let stars=[];

for(let i=0;i<220;i++){

stars.push({

x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
r:Math.random()*2

});

}

function draw(){

ctx.clearRect(0,0,canvas.width,canvas.height);

ctx.fillStyle="white";

for(let s of stars){

ctx.beginPath();
ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
ctx.fill();

s.y+=0.25;

if(s.y>canvas.height){

s.y=0;
s.x=Math.random()*canvas.width;

}

}

requestAnimationFrame(draw);

}

draw();

function enter(){

const status=document.getElementById("status");

let text=[

"Searching...",
"Locating The Vault...",
"Synchronizing...",
"Connection Established.",
"Welcome, Explorer."

];

let i=0;

status.innerHTML=text[0];

let timer=setInterval(()=>{

i++;

if(i<text.length){

status.innerHTML=text[i];

}else{

clearInterval(timer);

}

},1200);

}

document.getElementById("quartz").onclick=function(){

alert(
"💎 Discovery #1\n\nQuartz\n\nOne of Earth's most common minerals.\n\nKnowledge is your greatest treasure."
);

};

</script>

</body>
</html>
