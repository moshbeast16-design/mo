<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project MO</title>

<style>
body{
    margin:0;
    background:black;
    color:white;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
}

#stars{
    position:fixed;
    inset:0;
    z-index:-1;
}

.box{
    text-align:center;
}

h1{
    font-size:70px;
    margin-bottom:10px;
}

p{
    font-size:22px;
    opacity:.8;
}

button{
    margin-top:30px;
    padding:15px 35px;
    font-size:22px;
    border:none;
    border-radius:50px;
    cursor:pointer;
    background:#00bfff;
    color:white;
    transition:.3s;
}

button:hover{
    transform:scale(1.1);
}

.hidden{
    display:none;
    margin-top:30px;
    font-size:26px;
}
</style>
</head>

<body>

<canvas id="stars"></canvas>

<div class="box">

<h1>MO</h1>

<p>Oops... you found me.</p>

<button onclick="explore()">🚀 Start Exploring</button>

<div id="secret" class="hidden">
✨ You found the first Easter Egg! ✨
<br><br>
Welcome to <b>Project MO v1.0</b>
</div>

</div>

<script>

const canvas=document.getElementById("stars");
const ctx=canvas.getContext("2d");

function resize(){
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
}
resize();
window.onresize=resize;

let stars=[];

for(let i=0;i<200;i++){
stars.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
r:Math.random()*2
});
}

function animate(){

ctx.clearRect(0,0,canvas.width,canvas.height);

ctx.fillStyle="white";

for(let s of stars){

ctx.beginPath();
ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
ctx.fill();

s.y+=0.4;

if(s.y>canvas.height){
s.y=0;
s.x=Math.random()*canvas.width;
}

}

requestAnimationFrame(animate);

}

animate();

function explore(){

document.getElementById("secret").classList.remove("hidden");

}
</script>

</body>
</html>
